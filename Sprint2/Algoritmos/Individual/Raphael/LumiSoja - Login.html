<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> LumiSoja - Login </title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet"> 
</head>

<body class="login_background">

    <div class="login_texto"  id="div_login_texto">
            
        <span style="color: white; font-size: 60px;"> Hora do login </span>
        <span style="color: #ffde4e; font-style: italic; font-size: 40px;"> Vamos acessar sua <br> dashboard! </span>

    </div>

    <div class="login_formulario" id="div_login_formulario">
            
        <h3 class="login_titulo"> Login </h3>
        
        <div class="login_input">
        
            <span> E-mail </span>
            <br>
            <input type="text" id="ipt_email" oninput="EmailToLowerCase()">
            <br>
        
        </div>
        
        <div class="login_input">
            
            <span> Senha </span>
            <br>
            <input type="password" id="ipt_senha">
            
            <br>
        </div>
        
        <div class="login_botoes">

            <button onclick="RedirecionarCadastro()"> Cadastro </button>
            <button onclick="ValidarEmail()"> Entrar </button>

        </div>
        
    </div>

</body>

</html>

<script>

    let usuarioEmail = ['fernando.brandao@sptech.school', 'julia.araripe@sptech.school', 'marcos.antonio@sptech.school']
    let usuarioSenha = ['fbrand1@3', 'juli4@#$', 'ma2&8an']

    function EmailToLowerCase() {

        ipt_email.value = ipt_email.value.toLowerCase()
    }

    function ValidarEmail() {

        let email = ipt_email.value.replaceAll(' ', '')
        let senha = ipt_senha.value

        if (email.includes('@') && email.includes('.') && email.indexOf('@') != email.indexOf('.') - 1) {

            if ((email == usuarioEmail[0] && senha == usuarioSenha[0]) || (email == usuarioEmail[1] && senha == usuarioSenha[1]) ||
            (email == usuarioEmail[2] && senha == usuarioSenha[2])) {

                alert('Login realizado com sucesso!')
            }

            else {

                alert('Senha ou usuário incorretos!')
            }
        }

        else {

            alert('Insira um e-mail válido!')
        }
    }

    function RedirecionarCadastro(){

        alert('Essa função irá redirecionar ao bloco de cadastro no futuro.')
    }

</script>
