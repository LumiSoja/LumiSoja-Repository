<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1113" height="567" viewBox="0 0 1113 567" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1113" y2="567" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3F3F3"/>
      <stop offset="1" stop-color="#F1F1F1"/>
    </linearGradient>

    <linearGradient id="leftDark" x1="0" y1="302" x2="130" y2="567" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9B2F"/>
      <stop offset="1" stop-color="#4A932C"/>
    </linearGradient>

    <linearGradient id="leftLight" x1="0" y1="302" x2="331" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#47AA72"/>
      <stop offset="1" stop-color="#469A45"/>
    </linearGradient>

    <linearGradient id="centerBase" x1="130" y1="567" x2="1113" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#174C34"/>
      <stop offset="0.55" stop-color="#1F6B45"/>
      <stop offset="1" stop-color="#275D39"/>
    </linearGradient>

    <linearGradient id="centerOverlay" x1="429" y1="567" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#205C37"/>
      <stop offset="0.5" stop-color="#1E744B"/>
      <stop offset="1" stop-color="#245F37"/>
    </linearGradient>

    <linearGradient id="rightBright" x1="916" y1="447" x2="1113" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4E9630"/>
      <stop offset="1" stop-color="#47902D"/>
    </linearGradient>

    <linearGradient id="rightLight" x1="1015" y1="504" x2="1113" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#41A866"/>
      <stop offset="1" stop-color="#45A458"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1113" height="567" fill="url(#bg)"/>
  <rect width="1113" height="2" fill="#2D8C2F"/>

  <!-- left mountains -->
  <polygon points="0,302 0,567 130,567" fill="url(#leftDark)"/>
  <polygon points="0,302 331,520 130,567" fill="url(#leftLight)"/>
  <polygon points="0,302 130,567 20,567" fill="#49AB75" opacity="0.95"/>

  <!-- center ridge -->
  <polygon points="130,567 331,520 840,401 1113,567" fill="url(#centerBase)"/>
  <polygon points="429,567 840,401 1113,567" fill="url(#centerOverlay)" opacity="0.98"/>

  <!-- right mountains -->
  <polygon points="840,401 916,447 1113,370 1113,567" fill="url(#rightBright)"/>
  <polygon points="1015,504 1113,370 1113,567" fill="url(#rightLight)"/>
</svg>
